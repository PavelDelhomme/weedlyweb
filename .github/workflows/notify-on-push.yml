name: Notify on Push

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get commit info
        id: commit
        run: |
          echo "author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
      
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [WeedlyWeb] Nouveau commit sur ${{ steps.commit.outputs.branch }}
          to: ${{ secrets.EMAIL_TO }}
          from: WeedlyWeb CI
          body: |
            Un nouveau commit a été poussé sur le dépôt WeedlyWeb.
            
            Détails du commit :
            - Branche : ${{ steps.commit.outputs.branch }}
            - Auteur : ${{ steps.commit.outputs.author }}
            - Message : ${{ steps.commit.outputs.message }}
            - Hash : ${{ steps.commit.outputs.hash }}
            - URL : ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            
            Voir les changements : ${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}
          content_type: text/html

