name: Build and Test

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libcurl4-openssl-dev \
            libsqlite3-dev \
            libgdk-pixbuf2.0-dev
      
      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)
      
      - name: Check build artifacts
        run: |
          if [ -f build/WeedlyWeb ]; then
            echo "✅ Build réussi"
            ls -lh build/WeedlyWeb
          else
            echo "❌ Build échoué - exécutable non trouvé"
            exit 1
          fi

